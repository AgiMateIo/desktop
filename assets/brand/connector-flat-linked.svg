<!-- AgiMate connector, flat — tray and menu bar, state: connected.
     Flat rather than the faceted ramp connector-mark.svg carries, because this
     renders at 16-24 px: a gradient is invisible below about 40 px, and its dark end
     only spends contrast the mark needs against the strip behind it. The macOS menu
     bar demands a monochrome template anyway.
     Theme-aware: teal-600 on a light strip, teal-500 on a dark one. Anything that
     ignores prefers-color-scheme inside an SVG falls back to the dark value, which
     still holds 4.17 against a light strip.
     The module seated in the port at the standard 6.36 all round — the same figure the
     parent nests inside its chevron.
     Minimum size is 24 px, not 16: the stripe is 10.3% of the mark, so at 16 px it is
     1.6 px and ring and module fuse into a solid rhombus. Below 24 px show the empty
     port and say the state elsewhere — a state that reads as the other state is worse
     than no state at all. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="4.5874 -23.6626 70.8253 70.8253" role="img" aria-label="AgiMate connector, connected">
  <style>
    .agimate-mark { fill: #228391; }
    @media (prefers-color-scheme: light) { .agimate-mark { fill: #1c6975; } }
  </style>
  <path class="agimate-mark" fill-rule="evenodd" d="M26.2107 -17.9509 A19.501 19.501 0 0 1 53.7893 -17.9509 L69.7009 -2.0393 A19.501 19.501 0 0 1 69.7009 25.5393 L53.7893 41.4509 A19.501 19.501 0 0 1 26.2107 41.4509 L10.2991 25.5393 A19.501 19.501 0 0 1 10.2991 -2.0393 Z M32.552 -4.2924 A10.5331 10.5331 0 0 1 47.448 -4.2924 L56.0424 4.302 A10.5331 10.5331 0 0 1 56.0424 19.198 L47.448 27.7924 A10.5331 10.5331 0 0 1 32.552 27.7924 L23.9576 19.198 A10.5331 10.5331 0 0 1 23.9576 4.302 Z" />
  <path class="agimate-mark" d="M35.4038 1.8502 A6.5 6.5 0 0 1 44.5962 1.8502 L49.8998 7.1538 A6.5 6.5 0 0 1 49.8998 16.3462 L44.5962 21.6498 A6.5 6.5 0 0 1 35.4038 21.6498 L30.1002 16.3462 A6.5 6.5 0 0 1 30.1002 7.1538 Z" />
</svg>
